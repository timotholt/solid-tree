<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@timotholt/tree — examples</title>
    <style>
      :root {
        --text-muted: #8a8f98;
        --border-subtle: rgba(0, 0, 0, 0.12);
        --tree-row-active-bg: rgba(59, 130, 246, 0.14);
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, system-ui, sans-serif;
        margin: 0;
        padding: 32px 24px 80px;
        background: #f6f7f9;
        color: #1f2430;
      }
      main { max-width: 920px; margin: 0 auto; }
      h1 { margin: 0 0 4px; font-size: 28px; }
      .lede { color: #555; margin: 0 0 28px; line-height: 1.5; }
      .lede code, .demo-body code { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
      .lede code { background: #eef0f3; padding: 1px 6px; border-radius: 4px; font-size: 13px; }

      .demo {
        background: #fff;
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        padding: 20px 22px;
        margin-bottom: 20px;
      }
      .demo > header h2 { margin: 0 0 4px; font-size: 17px; }
      .demo > header p { margin: 0 0 16px; color: #5b626f; font-size: 13.5px; line-height: 1.5; }
      .demo-body {
        display: grid;
        grid-template-columns: minmax(220px, 300px) 1fr;
        gap: 20px;
        align-items: start;
      }
      @media (max-width: 680px) { .demo-body { grid-template-columns: 1fr; } }
      .demo-live {
        background: #fbfbfd;
        border: 1px solid var(--border-subtle);
        border-radius: 8px;
        padding: 8px;
      }
      .demo-code {
        margin: 0;
        background: #0f1729;
        color: #d6deeb;
        border-radius: 8px;
        padding: 14px 16px;
        font-size: 12.5px;
        line-height: 1.55;
        overflow-x: auto;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }

      .out { margin: 10px 4px 2px; font-size: 12.5px; color: #6b7280; }
      .badge {
        font-size: 10px; padding: 1px 7px; border-radius: 9px;
        background: #dcfce7; color: #166534; font-weight: 600;
        margin-left: 4px;
      }
      .badge-num { background: #e0e7ff; color: #3730a3; }
      .row-btn {
        border: none; background: transparent; cursor: pointer;
        color: #9ca3af; font-size: 12px; margin-left: 4px; padding: 0 2px;
      }
      .row-btn:hover { color: #dc2626; }
      .search {
        width: 100%; box-sizing: border-box; margin-bottom: 8px;
        padding: 6px 10px; font-size: 13px;
        border: 1px solid var(--border-subtle); border-radius: 6px;
        outline: none;
      }
      .search:focus { border-color: #3b82f6; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
