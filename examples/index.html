<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>solid-tree — examples</title>
    <style>
      :root {
        --text-muted: #5f6570;
        --border-subtle: rgba(0, 0, 0, 0.12);
        --bg: #f6f7f9;
        --panel: #fff;
        --fg: #1f2430;
        --accent: #2563eb;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text-muted: #a3a9b5;
          --border-subtle: rgba(255, 255, 255, 0.14);
          --bg: #15171c;
          --panel: #1d2027;
          --fg: #e7e9ee;
          --accent: #7cb7ff;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--fg); }
      .gallery { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
      @media (max-width: 760px) { .gallery { grid-template-columns: 1fr; } }
      .gallery-nav { border-right: 1px solid var(--border-subtle); padding: 20px 12px; background: var(--panel); }
      .gallery-brand { display: block; font-weight: 700; font-size: 18px; color: var(--fg); text-decoration: none; padding: 0 8px 12px; }
      .gallery-nav ol { list-style: none; margin: 0; padding: 0; }
      .gallery-nav a { display: block; padding: 6px 8px; border-radius: 6px; color: var(--fg); text-decoration: none; font-size: 14px; }
      .gallery-nav a[aria-current="page"] { background: color-mix(in srgb, var(--accent) 14%, transparent); }
      .gallery-nav .num { color: var(--text-muted); font-variant-numeric: tabular-nums; }
      .gallery-main { padding: 28px 32px 80px; max-width: 980px; }
      .gallery-main h1 { margin: 0 0 6px; font-size: 26px; }
      .gallery-main header p { margin: 0 0 12px; color: var(--text-muted); line-height: 1.5; }
      .tags { display: flex; gap: 6px; list-style: none; padding: 0; margin: 0 0 16px; flex-wrap: wrap; }
      .tags li { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 12%, transparent); }
      .demo-live { background: var(--panel); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 16px; }
      .source-bar { display: flex; gap: 12px; align-items: center; margin: 12px 0; font-size: 14px; }
      .source-bar a { color: var(--accent); }
      .source { background: var(--panel); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 14px; overflow: auto; font-size: 12.5px; line-height: 1.45; }
      button { font: inherit; }
      .checks { margin-top: 20px; padding: 0 8px; font-size: 13px; }
      .checks button { width: 100%; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border-subtle); background: var(--bg); color: var(--fg); cursor: pointer; }
      .checks ul { list-style: none; padding: 0; margin: 8px 0; }
      .checks li { padding: 2px 0; }
      .checks li:not([data-ok]) { color: #b42318; }
      .check-error { font-size: 12px; margin-left: 1.2em; word-break: break-word; }
      .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
      .toolbar button, .toolbar input, .toolbar select { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border-subtle); background: var(--bg); color: var(--fg); }
      .split { display: grid; grid-template-columns: minmax(240px, 340px) 1fr; gap: 16px; align-items: start; }
      @media (max-width: 680px) { .split { grid-template-columns: 1fr; } }
      .panel { border: 1px solid var(--border-subtle); border-radius: 8px; padding: 10px; min-height: 120px; }
      .muted { color: var(--text-muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
