name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *" # nightly: extra browser engines
  workflow_dispatch:

jobs:
  gate:
    name: gate (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: examples
      - run: npx playwright install --with-deps chromium
      - run: npm run gate
        env:
          VITEST_MAX_WORKERS: 4

  engines:
    name: browser (${{ matrix.browser }}, nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser
        env:
          BROWSER: ${{ matrix.browser }}

  lowest-peers:
    name: lowest supported peers (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Keep in sync with peerDependencies minimums (verified 2026-10-20).
      - run: npm i --no-save solid-js@1.9.16 @tanstack/solid-virtual@3.13.32 @tanstack/solid-query@5.30.0 @supabase/supabase-js@2.45.0
      - run: npx playwright install --with-deps chromium
      - run: npm test

  bench:
    name: benchmarks (nightly, trend only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run bench

  solid-next:
    name: solid-js@next (nightly, informational)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true # Solid 2 is a non-goal for 1.0; this tracks the distance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm i --no-save solid-js@next
      - run: npx playwright install --with-deps chromium
      - run: npm test
