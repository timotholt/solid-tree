name: Release

# On a version tag (v*): run the gate, publish to npm via npm Trusted Publishing (no
# token is stored; npm verifies this workflow through GitHub's OIDC identity and
# attaches a signed provenance statement), then create the GitHub Release with the
# matching CHANGELOG section as its notes.
#
# One-time setup on npmjs.com: package → Settings → Trusted Publisher → GitHub Actions,
# repository timotholt/solid-tree, workflow release.yml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm ci
        working-directory: examples
      - run: npx playwright install --with-deps chromium
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run gate
      - name: Publish (skipped if this version is already on npm)
        run: |
          NAME=$(node -p 'require("./package.json").name'); VERSION=$(node -p 'require("./package.json").version')
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published; nothing to do."
          else
            npm publish --provenance --access public
          fi
      - name: GitHub Release (skipped if it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; nothing to do."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          # The CHANGELOG section for this version, up to the next "## " heading.
          awk -v v="$VERSION" '
            index($0, "## " v " ") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          printf '\n---\n**Install:** `npm i @timotholt/solid-tree@%s` · **Demo & docs:** https://timotholt.github.io/solid-tree/\n' "$VERSION" >> notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md --latest
