<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@timotholt/tree playground</title>
    <style>
      :root {
        --text-muted: #8a8f98;
        --border-subtle: rgba(0, 0, 0, 0.12);
      }
      body {
        font-family: -apple-system, system-ui, sans-serif;
        margin: 0;
        padding: 24px;
        background: #f6f7f9;
      }
      #app {
        max-width: 320px;
        background: #fff;
        border: 1px solid var(--border-subtle);
        border-radius: 8px;
        padding: 8px;
      }
      .badge {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 8px;
        background: #e0e7ff;
        color: #3730a3;
      }
      .selected-out {
        max-width: 320px;
        margin-top: 16px;
        font-size: 13px;
        color: #444;
      }
    </style>
  </head>
  <body>
    <h2>@timotholt/tree</h2>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
